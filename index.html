<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>Live Dashboard</h1>
    <p id="updated">Loading...</p>
  </header>

  <main>
    <section class="stats">
      <div class="stat"><span>Total Visits</span><strong id="totalVisits">0</strong></div>
      <div class="stat"><span>Total Signups</span><strong id="totalSignups">0</strong></div>
      <div class="stat"><span>Conversion</span><strong id="conversion">0%</strong></div>
    </section>

    <section class="grid">
      <div class="card"><h2>Weekly Traffic</h2><canvas id="lineChart"></canvas></div>
      <div class="card"><h2>Device Split</h2><canvas id="doughnutChart"></canvas></div>
      <div class="card wide"><h2>Visits vs Signups</h2><canvas id="barChart"></canvas></div>
    </section>

    <section class="card controls">
      <h2>Add / Update a Day</h2>
      <form id="dataForm">
        <select id="day">
          <option>Mon</option><option>Tue</option><option>Wed</option>
          <option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
        </select>
        <input type="number" id="visits" placeholder="Visits" min="0" required>
        <input type="number" id="signups" placeholder="Signups" min="0" required>
        <button type="submit">Update</button>
      </form>
      <div class="buttons">
        <button id="toggleBtn">Pause Auto-Refresh</button>
        <button id="randomBtn">Randomize Now</button>
      </div>
    </section>
  </main>

  <footer>Web Technology Assignment</footer>
  <script src="script.js"></script>
</body>
</html>
